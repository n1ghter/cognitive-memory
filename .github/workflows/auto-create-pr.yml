name: Auto Create PR

on:
  push:
    branches-ignore:
      - main
      - master

permissions:
  pull-requests: write
  contents: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create the PR, and then immediately enable auto-merge on it
          gh pr create \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "$(git log -1 --pretty=%s)" \
            --body "Automated PR created from branch \`${{ github.ref_name }}\`." || true

          # Attempt to enable auto-merge (fails silently if repo settings don't allow it or PR doesn't exist)
          gh pr merge "${{ github.ref_name }}" --auto --merge --delete-branch || true
