name: Auto Create Draft PR

on:
  push:
    branches-ignore:
      - main
      - master
      - 'dependabot/**'

permissions:
  pull-requests: write
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Draft PR if none exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq 'length')
          if [ "$EXISTING" -gt 0 ]; then
            echo "Open PR already exists for ${{ github.ref_name }}, skipping."
            exit 0
          fi

          gh pr create \
            --draft \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "$(git log -1 --pretty=%s)" \
            --body "Draft PR automatically opened for branch \`${{ github.ref_name }}\`. Mark ready for review once CI and eval gates are green."
