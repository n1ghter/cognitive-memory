name: Auto Create PR

on:
  push:
    branches-ignore:
      - main
      - master

permissions:
  pull-requests: write
  contents: read

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The command will fail silently if a PR already exists for this branch
          gh pr create \
            --base main \
            --head "${{ github.ref_name }}" \
            --title "$(git log -1 --pretty=%s)" \
            --body "Automated PR created from branch \`${{ github.ref_name }}\`." || true
