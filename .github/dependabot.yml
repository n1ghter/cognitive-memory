version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/ui"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(deps-ui)"
    groups:
      ui-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
