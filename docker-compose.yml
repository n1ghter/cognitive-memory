services:
  cognitive-memory:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cognitive-memory
    ports:
      # Bind only to host loopback by default
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - MCP_HOST=0.0.0.0
      # Required whenever MCP_HOST is non-loopback; set in your shell or .env file
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?Set MCP_AUTH_TOKEN before starting SSE container}
      - OLLAMA_URL=http://host.docker.internal:11434
      - MEMORY_DB_PATH=/app/data/memory.sqlite
      - MEMORY_GLOBAL_DB_PATH=/app/data/global-memory.sqlite
    volumes:
      - cognitive_memory_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional local Ollama service. Enable with: docker compose --profile with-ollama up
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-engine
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    profiles:
      - with-ollama

volumes:
  cognitive_memory_data:
  ollama_data:
