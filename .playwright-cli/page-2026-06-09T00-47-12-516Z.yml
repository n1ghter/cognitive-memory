                    - img "PRs Welcome" [ref=e557]
                - paragraph [ref=e558]:
                  - link "Cognitive Memory Architecture" [ref=e559] [cursor=pointer]:
                    - /url: /n1ghter/cognitive-memory/blob/master/assets/hero.png
                    - img "Cognitive Memory Architecture" [ref=e560]
                - paragraph [ref=e561]:
                  - text: A high-performance, local-first
                  - strong [ref=e562]: Model Context Protocol (MCP)
                  - text: server that provides AI agents with persistent cognitive memory.
                - paragraph [ref=e563]:
                  - text: Unlike cloud-based memory solutions, Cognitive Memory runs entirely on your local machine using SQLite and local LLM embeddings. This ensures
                  - strong [ref=e564]: zero latency, zero API costs, and absolute data privacy
                  - text: — making it ideal for enterprise and personal environments.
                - separator [ref=e565]
                - generic [ref=e566]:
                  - 'heading "🌟 Why We Are Unique: Human-Agent Cognitive Symmetry" [level=2] [ref=e567]'
                  - 'link "Permalink: 🌟 Why We Are Unique: Human-Agent Cognitive Symmetry" [ref=e568] [cursor=pointer]':
                    - /url: "#-why-we-are-unique-human-agent-cognitive-symmetry"
                    - img [ref=e569]
                - paragraph [ref=e571]: Most AI memory platforms (like Graphiti, Letta, Cognee) lock the AI's "brain" inside opaque databases (Neo4j, ChromaDB, Pickles). If the AI remembers something incorrectly, it becomes a "black box" that is difficult for a human to debug or edit.
                - paragraph [ref=e572]:
                  - strong [ref=e573]: Cognitive Memory
                  - text: pioneers
                  - strong [ref=e574]: Bi-directional Human-Agent Symmetry
                  - text: ": We bridge the gap between an AI's Long-Term Memory and a human's Second Brain. The AI's memory is simply a collection of interconnected Markdown files in an Obsidian vault."
                - list [ref=e575]:
                  - listitem [ref=e576]:
                    - strong [ref=e577]: "Read:"
                    - text: You can open Obsidian and visually read what the agent is thinking.
                  - listitem [ref=e578]:
                    - strong [ref=e579]: "Edit:"
                    - text: You can delete or modify a markdown file, and the agent's memory instantly updates.
                  - listitem [ref=e580]:
                    - strong [ref=e581]: "Write:"
                    - text: You can write your own notes, and the agent natively understands them via Vector+Graph search.
                - generic [ref=e582]:
                  - heading "✨ Features" [level=2] [ref=e583]
                  - 'link "Permalink: ✨ Features" [ref=e584] [cursor=pointer]':
                    - /url: "#-features"
                    - img [ref=e585]
                - list [ref=e587]:
                  - listitem [ref=e588]:
                    - strong [ref=e589]: Semantic LTM
                    - text: ": Stores and retrieves long-term declarative memories using Cosine Similarity vector search."
                  - listitem [ref=e590]:
                    - strong [ref=e591]: Local Vectors
                    - text: ": Uses"
                    - code [ref=e592]: sqlite-vec
                    - text: and
                    - code [ref=e593]: better-sqlite3
                    - text: for blazing-fast local vector operations.
                  - listitem [ref=e594]:
                    - strong [ref=e595]: Local Embeddings
                    - text: ": Integrates directly with Ollama ("
                    - code [ref=e596]: qwen3-embedding:8b
                    - text: ) to generate 4096-dimensional embeddings locally without hitting external APIs.
                  - listitem [ref=e597]:
                    - strong [ref=e598]: Hybrid Graph Relations
                    - text: ": Connects memories together to form an explicit, interconnected knowledge graph."
                  - listitem [ref=e599]:
                    - strong [ref=e600]: Obsidian Sync
                    - text: ": Bidirectional synchronization with local Markdown vaults (e.g., Obsidian). Manually edit"
                    - code [ref=e601]: .md
                    - text: memory files, and the changes sync back to SQLite.
                  - listitem [ref=e602]:
                    - strong [ref=e603]: Code Intelligence
                    - text: ": Integrates"
                    - strong [ref=e604]: GitNexus
                    - text: via a Git
                    - code [ref=e605]: post-commit
                    - text: hook to asynchronously update the AST knowledge graph for deep codebase intelligence.
                - generic [ref=e606]:
                  - heading "🚀 Installation & Setup" [level=2] [ref=e607]
                  - 'link "Permalink: 🚀 Installation & Setup" [ref=e608] [cursor=pointer]':
